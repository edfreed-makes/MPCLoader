name: Icon check (temporary)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/icon-check.yml
      - scripts/render-icon.swift
      - scripts/build-app.sh
      - icon/**
jobs:
  icon:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sw_vers
          scripts/build-app.sh
      - name: Icon as built
        continue-on-error: true
        run: |
          swiftc -O scripts/render-icon.swift -o /tmp/render-icon
          /tmp/render-icon "dist/MPC Loader.app" /tmp/as-built.png
      - name: Icon with the .icns alone
        continue-on-error: true
        run: |
          cp -R "dist/MPC Loader.app" "/tmp/Icns Only.app"
          rm -f "/tmp/Icns Only.app/Contents/Resources/Assets.car"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" "/tmp/Icns Only.app/Contents/Info.plist"
          codesign --force --sign - "/tmp/Icns Only.app"
          /tmp/render-icon "/tmp/Icns Only.app" /tmp/icns-only.png
      - name: What is in the compiled icon
        continue-on-error: true
        run: xcrun --find assetutil >/dev/null 2>&1 && xcrun assetutil --info "dist/MPC Loader.app/Contents/Resources/Assets.car" | grep -E '"(AssetType|Name|PixelWidth|Appearance|Idiom|RenditionName)"' | sort | uniq -c | head -40
      - name: Save what macOS draws
        run: |
          mkdir -p docs/icon-check
          cp /tmp/as-built.png "docs/icon-check/${{ matrix.os }}.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/icon-check
          git commit -m "Icon check: what ${{ matrix.os }} draws"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
