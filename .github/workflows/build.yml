name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Unit tests
        run: swift test 2>&1 | tail -n 40
      - name: Build MPC Loader.app
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Check the app starts and take screenshots
        # Demo scenes show sample content and never touch the network.
        run: |
          mkdir -p shots
          shoot() {
            name="$1"; shift
            "dist/MPC Loader.app/Contents/MacOS/MPCLoader" "$@" &
            pid=$!
            sleep 7
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "The app exited during start-up ($name)." >&2
              exit 1
            fi
            screencapture -x "shots/$name.png" || echo "No screenshot for $name."
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          }
          shoot connect --demo-connect --light
          shoot developer-mode-off --demo-refused --light
          shoot browser-light --demo --light
          shoot browser-dark --demo --dark
          shoot report --demo-report --light
          ls -l shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn
      - name: Package
        run: ditto -c -k --keepParent "dist/MPC Loader.app" "dist/MPC-Loader.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Loader-mac
          path: dist/MPC-Loader.zip

  core:
    name: Core tests against a stand-in MPC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load exFAT and FAT drivers
        run: sudo modprobe -a exfat vfat || true
      - name: Run the tests in a throwaway container
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src swift:6.0-noble bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends openssh-client openssh-server busybox-static dosfstools exfatprogs e2fsprogs >/dev/null
            scripts/integration-test.sh'
