name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build 2>&1 | grep -v -E "^\[[0-9]+/[0-9]+\]" || true; swift build
      - name: Unit tests
        run: swift test 2>&1 | grep -E "error|failed|Executed|passed \(" | tail -n 60
      - name: Build MPC Loader.app
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Check the app starts and take screenshots
        # Demo scenes show sample content and never touch the network.
        run: scripts/take-screenshots.sh shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn
      - name: Try the space bar and drags to the Desktop
        # Presses real keys and drags real rows in a demo scene, where every file is a generated tone.
        continue-on-error: true
        run: |
          swiftc -O scripts/ui-poke.swift -o /tmp/ui-poke
          "dist/MPC Loader.app/Contents/MacOS/MPCLoader" --demo --light > /tmp/app.log 2>&1 &
          pid=$!
          sleep 6
          # Select "Hat Closed 03.aif" and press the space bar (key 49), then space again to stop.
          /tmp/ui-poke click 340 309 sleep 0.6 key 49 sleep 2.5 key 49 sleep 1
          # Drag rows of different kinds out of the window onto the Desktop.
          /tmp/ui-poke drag 340 285 1004 130 sleep 3   # Dusty Loop 92bpm.wav
          /tmp/ui-poke drag 340 309 1004 260 sleep 3   # Hat Closed 03.aif
          /tmp/ui-poke drag 340 212 1004 390 sleep 3   # Beat Tape 3.xpj
          /tmp/ui-poke drag 340 405 1004 520 sleep 3   # Verse Fill.mid
          /tmp/ui-poke drag 340 357 120 684 sleep 3    # Rhodes Chords.flac
          /tmp/ui-poke drag 340 453 300 684 sleep 3    # Vocal Chop.mp3
          /tmp/ui-poke drag 340 187 480 684 sleep 4    # 808 Essentials (a folder)
          kill "$pid" 2>/dev/null || true
          echo "--- what the app reported"
          cat /tmp/app.log
          echo "--- Desktop"
          ls -la ~/Desktop
          ls -la ~/Desktop/*/ 2>/dev/null || true
      - name: Package
        run: ditto -c -k --keepParent "dist/MPC Loader.app" "dist/MPC-Loader.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Loader-mac
          path: dist/MPC-Loader.zip

  core:
    name: Core tests against a stand-in MPC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load exFAT and FAT drivers
        run: sudo modprobe -a exfat vfat || true
      - name: Run the tests in a throwaway container
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src swift:6.0-noble bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends openssh-client openssh-server busybox-static dosfstools exfatprogs e2fsprogs >/dev/null
            scripts/integration-test.sh'

  screenshots:
    # Run by hand (Actions → Build → Run workflow) to refresh the pictures in the README.
    name: Refresh README screenshots
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build MPC Loader.app
        run: scripts/build-app.sh
      - name: Take screenshots
        run: scripts/take-screenshots.sh docs/screenshots
      - name: Save them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Refresh README screenshots"
          git push
