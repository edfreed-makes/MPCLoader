name: Layout check (temporary)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/layout-check.yml
jobs:
  today:
    # The app as it is built today: on macOS 15, with that Mac's standard Apple tools.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcode-select -p
          scripts/build-app.sh
          otool -l "dist/MPC Loader.app/Contents/MacOS/MPCLoader" | grep -A4 LC_BUILD_VERSION | grep -E "minos|sdk"
          ditto -c -k --keepParent "dist/MPC Loader.app" today.zip
      - uses: actions/upload-artifact@v4
        with:
          name: today
          path: today.zip

  photos:
    needs: today
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: today
      - name: Build with the current Apple tools
        run: |
          sw_vers
          xcode-select -p
          scripts/build-app.sh
          otool -l "dist/MPC Loader.app/Contents/MacOS/MPCLoader" | grep -A4 LC_BUILD_VERSION | grep -E "minos|sdk"
          mv "dist/MPC Loader.app" "/tmp/MPC Loader current.app"
          ditto -x -k today.zip /tmp/today
          mv "/tmp/today/MPC Loader.app" "/tmp/MPC Loader today.app"
          xattr -dr com.apple.quarantine "/tmp/MPC Loader today.app" || true
      - name: Photograph both on macOS 26
        run: |
          mkdir -p docs/layout-check
          caffeinate -d -u -t 600 &
          for tag in today current; do
            app="/tmp/MPC Loader $tag.app"
            for scene in connect browser; do
              flag="--demo"; [ "$scene" = connect ] && flag="--demo-connect"
              "$app/Contents/MacOS/MPCLoader" $flag --light &
              pid=$!
              sleep 8
              screencapture -x "docs/layout-check/$tag-$scene.png" || true
              kill "$pid"; wait "$pid" 2>/dev/null || true
            done
          done
          ls -l docs/layout-check
      - name: Save them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/layout-check
          git commit -m "Layout check: macOS 26 screenshots"
          for attempt in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
